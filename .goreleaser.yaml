version: 2

project_name: speedtest

builds:
  - binary: speedtest
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lroolle/speedtestcli/internal/version.Version={{.Version}}
      - -X github.com/lroolle/speedtestcli/internal/version.GitCommit={{.FullCommit}}
      - -X github.com/lroolle/speedtestcli/internal/version.BuildDate={{.Date}}
    flags:
      - -trimpath

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
